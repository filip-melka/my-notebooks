name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Export notebooks
        run: |
          mkdir -p _site
          # Landing page (if present)
          if [ -d site ]; then cp -r site/. _site/; fi
          # Every notebook in notebooks/ is published as a WebAssembly app.
          # Work in progress and anything that can't run in the browser
          # (e.g. YOLO: PyTorch, webcam) lives in drafts/ and is not published.
          for f in notebooks/*.py; do
            name=$(basename "$f" .py)
            # Run from notebooks/ so marimo finds head.html next to the notebook.
            (cd notebooks && uvx marimo@0.25.2 export html-wasm "$name.py" \
              -o "$GITHUB_WORKSPACE/_site/$name" --mode run)
            # Replace marimo's default icons with ours (same file names).
            cp site/favicon.svg site/favicon.ico site/apple-touch-icon.png \
               "_site/$name/"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
